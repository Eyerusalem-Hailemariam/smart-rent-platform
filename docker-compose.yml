version: '3.8'

services:
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - '5001:5001'
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongo:27017/authServiceDB
      - JWT_SECRET=JWT_SECRET
    depends_on:
      - mongo

  listing-service:
    build: ./listing-service
    container_name: listing-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongo:27017/listingdb
      - CLOUDINARY_NAME=dgr325jcg
      - CLOUDINARY_API_KEY=463334626256935
      - CLOUDINARY_API_SECRET=Yl9xliClUpZuo38J4pIya9EiGnk

    depends_on:
      - mongo
      
  booking-service:
    build: ./booking-service
    container_name: booking-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongo:27017/bookingdb
    depends_on:
      - mongo

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - MONGO_URI=mongodb://mongo:27017/notification-db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://mongo:27017/paymentdb
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      - mongo

  mongo:
    image: mongo
    container_name: mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  mongo-data:
